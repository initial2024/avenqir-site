name: AVENQIR directory browser smoke
on:
  push:
    branches: [main]
    paths: ['site/directory*','site/atlas-*','tests/browser_directory_first_paint.py','.github/workflows/directory-browser-smoke.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify local-first directory in actual Chrome
        run: python3 tests/browser_directory_first_paint.py

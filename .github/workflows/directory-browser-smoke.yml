name: AVENQIR directory browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['site/index.html','site/directory*','site/atlas-*','tests/browser_directory_first_paint.py','tests/browser_popular_mobile.py','tests/browser_semantic_download.py','.github/workflows/directory-browser-smoke.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify local-first directory in actual Chrome
        run: python3 tests/browser_directory_first_paint.py
      - name: Verify 390×844 homepage and Popular directory controls
        run: python3 tests/browser_popular_mobile.py

      - name: Verify real model consent, download, integrity and cache
        run: python3 tests/browser_semantic_download.py

name: AVENQIR / research Firefox candidate checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/research-firefox.yml'
permissions:
  contents: read
concurrency:
  group: avenqir-research-firefox-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify actual browser binaries
        run: |
          command -v firefox
          firefox --version
          command -v geckodriver
          geckodriver --version
      - name: Test Firefox directory and packaged candidate without deployment
        run: |
          python3 tests/browser_research_semantic_directory.py --firefox
          python3 tests/browser_research_semantic_directory.py --firefox --packaged

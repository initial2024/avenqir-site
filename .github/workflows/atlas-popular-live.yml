name: AVENQIR production Popular check

on:
  push:
    branches: [atlas-popular-observations-20261124]
    paths: [evidence/atlas-popular-live-ref.txt, .github/workflows/atlas-popular-live.yml]

permissions:
  contents: read

jobs:
  public-view:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Await the production FTPS workflow
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url = 'https://api.github.com/repos/initial2024/avenqir-site/actions/runs/45408217551'
          for _ in range(24):
              with urllib.request.urlopen(url, timeout=12) as response:
                  run = json.load(response)
              if run['status'] == 'completed':
                  assert run['conclusion'] == 'success', run['conclusion']
                  break
              time.sleep(10)
          else:
              raise SystemExit('Deployment workflow did not finish in the verification window')
          PY
      - name: Check the deployed release and displayed directory counts
        run: |
          python3 - <<'PY'
          import html, json, re, shutil, subprocess, tempfile, urllib.request
          from pathlib import Path

          root = 'https://avenqir.bg5.net/'
          revision, curated, reviewed = Path('evidence/atlas-popular-live-ref.txt').read_text().split()
          try:
              request = urllib.request.Request(root + 'deploy-state.json?check=' + revision[:12], headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  document = response.read(64000)
              if b'slowAES.decrypt' in document or b'/aes.js' in document:
                  print('PUBLIC_MARKER=access challenge', flush=True)
              else:
                  marker = json.loads(document)
                  assert marker['commit'] == revision, 'The public marker references a different deployment'
                  print('PUBLIC_MARKER=' + revision, flush=True)
          except (OSError, ValueError, KeyError) as err:
              print('PUBLIC_MARKER=unavailable ' + type(err).__name__, flush=True)
          chrome = shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome
          with tempfile.TemporaryDirectory() as profile:
              result = subprocess.run(
                  [chrome,'--headless','--no-sandbox','--disable-dev-shm-usage',
                   '--disable-background-networking','--disable-gpu','--no-first-run',
                   '--user-data-dir='+profile,'--virtual-time-budget=18000',
                   '--dump-dom',root+'directory.html'],
                  capture_output=True,text=True,check=True,timeout=80,
              )
          output = result.stdout
          if 'slowAES.decrypt' in output and 'atlasLiveCount' not in output:
              raise SystemExit('PUBLIC_PAGE=access challenge')
          assert 'link-gate.js?v=126' in output, 'The browser did not load the v126 directory shell'
          def field(element):
              found = re.search(r'<[^>]+id="'+element+r'"[^>]*>([^<]*)', output)
              assert found, 'Rendered element missing: '+element
              return html.unescape(found[1])
          total = field('atlasLiveCount')
          count = field('atlasFilterCounts')
          assert re.search(r'(?:Curated|已整理) [\d,]+ (?:unique websites|个独立网址)', total), total
          assert int(re.search(r'[\d,]+', total)[0].replace(',','')) >= int(curated), total
          assert re.search(r'(?:source reviewed|来源核对) '+reviewed+r'\b', count), count
          assert re.search(r'id="popularCards"', output)
          print('LIVE_DIRECTORY=' + total)
          print('LIVE_SOURCE_COUNT=' + count)
          print('LIVE_ASSET_VERSION=126')
          PY

name: AVENQIR / verify and deploy via FTPS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      do_deploy:
        description: 'Deploy approved files if not paused by AVENQIR_DEPLOY_PAUSED.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('avenqir-pr-{0}', github.event.pull_request.number) || 'avenqir-production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate public repository payload
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_public.py
          python3 scripts/audit_directory_links.py
      - name: Simulate FTPS create, overwrite and rollback
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_site_features.cjs
          node tests/test_bookmark_interop.cjs
          node tests/test_directory_gate.cjs
          node tests/test_link_remember.cjs
          node tests/test_atlas_paths.cjs
          node tests/test_dynamic_atlas.cjs
          node tests/test_atlas_personalize.cjs
          node tests/test_atlas_specialist.cjs
          node tests/test_atlas_taxonomy.cjs
          node tests/test_atlas_region.cjs
          node tests/test_atlas_safety.cjs
          node tests/test_atlas_i18n.cjs
          node tests/test_atlas_popular.cjs
          node tests/test_recommendations_v138.cjs
          node tests/test_local_organize.cjs
          node tests/test_atlas_release.cjs
          node scripts/train_atlas_embedding.cjs --check
          if test -f scripts/research_atlas_embedding_v2.cjs; then node scripts/research_atlas_embedding_v2.cjs --check; fi
          if test -f scripts/research_atlas_retrieval_v2.cjs; then node scripts/research_atlas_retrieval_v2.cjs; fi
          if test -f scripts/research_atlas_unicode.cjs; then node scripts/research_atlas_unicode.cjs --check; fi
          if test -f scripts/research_atlas_full_multilingual.cjs; then node scripts/research_atlas_full_multilingual.cjs --check; fi
          if test -f scripts/research_atlas_paraphrases.cjs; then node scripts/research_atlas_paraphrases.cjs; fi
          if test -f scripts/research_atlas_locale_fusion.cjs; then node scripts/research_atlas_locale_fusion.cjs; fi
          if test -f scripts/build_semantic_candidate.cjs; then node scripts/build_semantic_candidate.cjs --check; fi
          if test -f scripts/research_atlas_pack.cjs; then node scripts/research_atlas_pack.cjs --check; fi
          if test -f tests/research_atlas_worker_client.cjs; then node tests/research_atlas_worker_client.cjs; node --check research/atlas-search-worker.js; fi
          node tests/test_atlas_semantic.cjs
          node tests/test_transfer_v90.cjs
          node tests/test_orbit_bridge.cjs
          node tests/test_i18n_v91.cjs
          php tests/test_server_url_classification.php
          php tests/test_admin_security.php
          php tests/test_unified_admin_session.php
          php tests/test_trusted_browser.php
          php tests/test_passkey_crypto.php
          php tests/test_traffic.php
      - name: Check PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v php >/dev/null
          command -v node >/dev/null
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find site -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find site -name '*.js' -print0)
  recommendations-db:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-db
          MYSQL_DATABASE: avenqir_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise actual MySQL rating and click transactions
        env:
          AQ_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=avenqir_test;charset=utf8mb4
          AQ_TEST_USER: root
          AQ_TEST_PASSWORD: fixture-only-db
        run: |
          php -m | grep -i pdo_mysql
          php tests/test_recommendations_mysql.php
          php tests/test_traffic_mysql.php
          python3 tests/check_recommendations_http.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify actual Chrome directory and mobile interactions
        run: |
          python3 tests/browser_directory_first_paint.py
          python3 tests/browser_popular_mobile.py
          python3 tests/browser_semantic_download.py
          if test -f tests/browser_research_semantic_worker.py; then python3 tests/browser_research_semantic_worker.py; fi
          if test -f tests/browser_research_semantic_directory.py; then python3 tests/browser_research_semantic_directory.py; python3 tests/browser_research_semantic_directory.py --packaged; fi
  deploy:
    needs: [verify, recommendations-db, browser]
    if: >-
      vars.AVENQIR_DEPLOY_PAUSED != 'true' &&
      github.repository == 'initial2024/avenqir-site' &&
      github.actor == 'initial2024' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.do_deploy == true)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the reviewed semantic v154 candidate, not the legacy site
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/avenqir-approved-release"
          node scripts/build_semantic_candidate.cjs "$RUNNER_TEMP/avenqir-approved-release/site"
          python3 scripts/ftps_deploy.py --semantic-stage "$RUNNER_TEMP/avenqir-approved-release/site" --candidate-commit "$GITHUB_SHA" --manifest-sha256 00d9e634adac8073d22da828dfda013e04aaf2eae6c440813128c38ecdef8778 --plan-only
      - name: Verify previous public deployment marker (read only)
        env:
          FTPS_USERNAME: ${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.AVENQIR_FTPS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import sys,json,ssl,ftplib
          sys.path.insert(0,'scripts')
          from ftps_deploy import HOST,REMOTE,credential,retrieve
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          try:
              ftp.connect(HOST,21,timeout=25);ftp.login(credential('FTPS_USERNAME'),credential('FTPS_PASSWORD'))
              ftp.prot_p();ftp.set_pasv(True);ftp.cwd(REMOTE)
              marker=json.loads(retrieve(ftp,'deploy-state.json'))
              prior=marker.get('commit')=='7a96ddb76cc5a6cb81d4c1f1b3bb645db0307fac' and marker.get('candidate_revision')=='2d25890ca56228c7' and marker.get('candidate_manifest_sha256')=='c12a766c5457498fb822c9744311570b423d4bb1345a4c44abfef55f956da284'
              same=marker.get('candidate_revision')=='67f5e37b64a4a424' and marker.get('candidate_manifest_sha256')=='00d9e634adac8073d22da828dfda013e04aaf2eae6c440813128c38ecdef8778'
              if not (prior or same):raise RuntimeError('Unexpected prior deployment marker; stop')
              print('PREVIOUS_DEPLOYMENT_MARKER_PASS',marker.get('commit'),flush=True)
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
      - name: Upload only the approved audited candidate with authenticated TLS
        env:
          FTPS_USERNAME: ${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.AVENQIR_FTPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export AVENQIR_SEMANTIC_RELEASE_APPROVAL="$GITHUB_SHA:00d9e634adac8073d22da828dfda013e04aaf2eae6c440813128c38ecdef8778"
          python3 -u scripts/ftps_deploy.py --semantic-stage "$RUNNER_TEMP/avenqir-approved-release/site" --candidate-commit "$GITHUB_SHA" --manifest-sha256 00d9e634adac8073d22da828dfda013e04aaf2eae6c440813128c38ecdef8778
      - name: Independently read back candidate runtime and public core
        env:
          FTPS_USERNAME: ${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.AVENQIR_FTPS_PASSWORD }}
        run: python3 scripts/verify_semantic_candidate_receipt.py "$RUNNER_TEMP/avenqir-approved-release/site" "00d9e634adac8073d22da828dfda013e04aaf2eae6c440813128c38ecdef8778"
      - name: Verify public model through ordinary Chromium browser and activate local search
        run: node scripts/check_semantic_public_browser.cjs
      - name: Raw public HTTP probe (host challenge may block non-browser clients)
        if: always()
        continue-on-error: true
        run: python3 scripts/check_semantic_host.py

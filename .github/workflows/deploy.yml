name: AVENQIR / verify and deploy via FTPS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      do_deploy:
        description: 'Deploy approved files if not paused by AVENQIR_DEPLOY_PAUSED.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avenqir-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate public repository payload
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_public.py
          python3 scripts/audit_directory_links.py
      - name: Simulate FTPS create, overwrite and rollback
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_site_features.cjs
          node tests/test_bookmark_interop.cjs
          node tests/test_directory_gate.cjs
          node tests/test_link_remember.cjs
          node tests/test_atlas_paths.cjs
          node tests/test_dynamic_atlas.cjs
          node tests/test_atlas_personalize.cjs
          node tests/test_atlas_specialist.cjs
          node tests/test_atlas_taxonomy.cjs
          node tests/test_atlas_region.cjs
          node tests/test_atlas_safety.cjs
          node tests/test_atlas_i18n.cjs
          node tests/test_atlas_popular.cjs
          node tests/test_recommendations_v138.cjs
          node tests/test_transfer_v90.cjs
          node tests/test_orbit_bridge.cjs
          node tests/test_i18n_v91.cjs
          php tests/test_server_url_classification.php
          php tests/test_admin_security.php
          php tests/test_unified_admin_session.php
          php tests/test_trusted_browser.php
          php tests/test_passkey_crypto.php
      - name: Check PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v php >/dev/null
          command -v node >/dev/null
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find site -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find site -name '*.js' -print0)
  deploy:
    needs: verify
    if: >-
      vars.AVENQIR_DEPLOY_PAUSED != 'true' &&
      github.repository == 'initial2024/avenqir-site' &&
      github.actor == 'initial2024' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.do_deploy == true)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate fresh CERT Polska public catalog screening
        continue-on-error: true
        run: python3 scripts/build_atlas_threat_snapshot.py
      - name: Generate official federal domain registration evidence
        continue-on-error: true
        run: python3 scripts/build_atlas_registry_snapshot.py
      - name: Upload site with authenticated TLS
        env:
          FTPS_USERNAME: ${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.AVENQIR_FTPS_PASSWORD }}
        run: python3 scripts/ftps_deploy.py
      - name: Compare HTTPS deployment marker with commit (host anti-bot may intervene)
        continue-on-error: true
        run: python3 scripts/check_live.py

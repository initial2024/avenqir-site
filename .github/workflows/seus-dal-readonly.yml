name: SEUS / public DAL read-only diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/seus-dal-readonly.yml']
permissions:
  contents: read
concurrency:
  group: avenqir-production
  cancel-in-progress: false
jobs:
  read-only:
    if: github.repository == 'initial2024/avenqir-site' && github.actor == 'initial2024' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (Node 24)
        with:
          persist-credentials: false
      - name: Read only the existing public association file using FTPS
        id: disk
        env:
          FTPS_USERNAME: ${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.AVENQIR_FTPS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, hashlib, os, ssl, sys
          from pathlib import Path
          expected=Path('site/.well-known/assetlinks.json').read_bytes()
          data=bytearray()
          def receive(chunk):
              if len(data)+len(chunk)>65536:
                  raise ValueError('LIMIT')
              data.extend(chunk)
          ftp=None
          try:
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
              ftp.connect('ftpupload.net',21,timeout=20)
              ftp.login(os.environ['FTPS_USERNAME'],os.environ['FTPS_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              ftp.cwd('avenqir.bg5.net/htdocs/.well-known')
              ftp.retrbinary('RETR assetlinks.json',receive,blocksize=8192)
              ok=bool(expected) and hashlib.sha256(data).digest()==hashlib.sha256(expected).digest()
              print('DAL_FTPS_BYTES='+('PASS' if ok else 'DENY_MISMATCH'))
              if not ok: sys.exit(1)
          except Exception as exc:
              print('DAL_FTPS_READ=DENY_'+type(exc).__name__)
              sys.exit(1)
          finally:
              if ftp is not None:
                  try: ftp.quit()
                  except Exception: ftp.close()
          PY
      - name: Independently check direct public HTTPS without browser cookies
        id: https
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          expected=json.loads(Path('site/.well-known/assetlinks.json').read_bytes())
          try:
              req=urllib.request.Request('https://avenqir.bg5.net/.well-known/assetlinks.json',headers={'Accept':'application/json','User-Agent':'AVENQIR DAL public audit'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=25) as r:
                  data=r.read(65537)
                  media=r.headers.get_content_type()
                  if media=='text/html':
                      sample=data[:16384].lower()
                      print('DAL_HTTPS=DENY_'+('HOST_BROWSER_CHALLENGE' if b'aes.js' in sample and (b'__test' in sample or b'document.cookie' in sample) else 'NON_JSON_HTML'))
                      sys.exit(1)
                  if r.status!=200 or media!='application/json' or len(data)>65536:
                      print('DAL_HTTPS=DENY_RESPONSE')
                      sys.exit(1)
                  if json.loads(data)!=expected:
                      print('DAL_HTTPS=DENY_TARGET_MISMATCH')
                      sys.exit(1)
                  print('DAL_HTTPS=PASS')
          except Exception as exc:
              print('DAL_HTTPS=DENY_'+type(exc).__name__)
              sys.exit(1)
          PY
      - name: Summarize independent gates (no deployment)
        if: always()
        env:
          DISK: ${{ steps.disk.outcome }}
          HTTPS: ${{ steps.https.outcome }}
        run: |
          {
            echo '## SEUS public association diagnostics'
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| FTPS disk bytes | $DISK |"
            echo "| Direct public HTTPS | $HTTPS |"
            echo ''
            if [ "$DISK" = success ] && [ "$HTTPS" != success ]; then
              echo 'The uploaded file is correct. Public delivery remains blocked; contact hosting support. Do not re-upload or weaken authentication.'
            fi
            echo 'This workflow is read-only and never deploys or publishes an APK.'
          } >> "$GITHUB_STEP_SUMMARY"

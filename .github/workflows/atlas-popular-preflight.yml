name: AVENQIR Popular preflight

on:
  push:
    branches: [atlas-popular-observations-20261124]
    paths: [evidence/atlas-popular-preflight-ref.txt, .github/workflows/atlas-popular-preflight.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1210a9662d9af638ed680616caebba369798d4a0
          persist-credentials: false
      - name: Instrument layout overflow diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_popular_mobile.py')
          t=p.read_text()
          t=t.replace("require(h.documentElement.scrollWidth<=390&&d.documentElement.scrollWidth<=390,'page overflows the mobile viewport');", """const describe=(win)=>{
            const doc=win.document;
            const overflowing=[...doc.querySelectorAll('body *')].filter(node=>{
              const box=node.getBoundingClientRect();
              if(box.right<=390||box.height===0)return false;
              let parent=node.parentElement;
              while(parent&&parent!==doc.body){
                if(['auto','scroll','hidden','clip'].includes(win.getComputedStyle(parent).overflowX))return false;
                parent=parent.parentElement;
              }
              return true;
            }).slice(0,18).map(node=>node.tagName+'#'+node.id+'.'+String(node.className).slice(0,42)+'@'+Math.round(node.getBoundingClientRect().right));
            return doc.documentElement.scrollWidth+' '+overflowing.join('|');
          };
          require(h.documentElement.scrollWidth<=390&&d.documentElement.scrollWidth<=390,'home '+describe(home)+'; directory '+describe(directory));""")
          t=t.replace("re.search(r'<html[^>]+>', result.stdout)", "re.search(r'<html[^>]+>', result.stdout).group(0)")
          p.write_text(t)
          PY
      - name: Verify 390×844 homepage and directory
        run: python3 tests/browser_popular_mobile.py
      - name: Verify directory first paint and interaction flow
        run: python3 tests/browser_directory_first_paint.py
      - name: Verify public data, source gate, translations and application tests
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_public.py
          python3 scripts/audit_directory_links.py
          python3 -m unittest discover -s tests -v
          for test in tests/test_*.cjs; do node "$test"; done
          php tests/test_server_url_classification.php
          php tests/test_admin_security.php
          php tests/test_unified_admin_session.php
          php tests/test_trusted_browser.php
          php tests/test_passkey_crypto.php

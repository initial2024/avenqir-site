name: AVENQIR / feature checks (no deployment)
on:
  push:
    branches: ['feature/quick-search-local-transfer-20261123', 'feature/netscape-bookmarks-themes-20261123', 'fix/theme-navigation-cache-20261123', 'feature/atlas-v85-mobile-discovery-20261123', 'feature/atlas-v86-optin-local-recommendations-20261123', 'feature/atlas-v87-category-expansion-20261123', 'feature/atlas-v88-region-optin-deeper-directory-20261123', 'feature/atlas-v89-security-audit-20261123', 'feature/atlas-v90-guided-workflows-search-transfer-20261123', 'feature/avenqir-v91-orbit-bridge-i18n-hardcoded-20261123']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check deploy allowlist and public repository
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_public.py
          python3 scripts/audit_directory_links.py
      - name: Test offline data migration, UI wiring and deploy safety
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_site_features.cjs
          node tests/test_bookmark_interop.cjs
          node tests/test_directory_gate.cjs
          node tests/test_link_remember.cjs
          node tests/test_atlas_paths.cjs
          node tests/test_dynamic_atlas.cjs
          node tests/test_atlas_personalize.cjs
          node tests/test_atlas_specialist.cjs
          node tests/test_atlas_taxonomy.cjs
          node tests/test_atlas_region.cjs
          node tests/test_atlas_safety.cjs
          node tests/test_atlas_i18n.cjs
          node tests/test_atlas_popular.cjs
          node tests/test_transfer_v90.cjs
          node tests/test_orbit_bridge.cjs
          node tests/test_i18n_v91.cjs
          php tests/test_server_url_classification.php
          php tests/test_admin_security.php
          php tests/test_unified_admin_session.php
          php tests/test_trusted_browser.php
          php tests/test_passkey_crypto.php
      - name: Validate JavaScript and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -name '*.js' -print0)
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find site -name '*.php' -print0)

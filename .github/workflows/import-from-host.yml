name: AVENQIR - import installed public site via FTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-from-host.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avenqir-source-bootstrap
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'initial2024/avenqir-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Download only explicitly allowed public program files
        env:
          FTP_USER: \${{ secrets.AVENQIR_FTPS_USERNAME }}
          FTP_PASSWORD: \${{ secrets.AVENQIR_FTPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, hashlib, io, os, pathlib, re, ssl, sys
          names = """
          index.html directory.html directory.js directory-search.css directory-seed.json
          common.css site.js check.html check.js tools.html tools.js projects.html projects.js
          domains.html domains.js logs.html logs.js fun.html fun.js daily.html daily.js
          bookmarks.html bookmarks.js notes.html notes.js health.html health.js
          disclaimer.html privacy.html feedback.php feedback.css feedback-admin.php
          feedback-admin.js feedback-core.php admin.php server-core.php public-api.php
          seed-links.php status.php sw.js icon.svg manifest.webmanifest hero-lake.webp
          """.split()
          required = {'index.html', 'directory.html', 'fun.html', 'tools.html'}
          bad_names = {'_private', '_store', '.htaccess', '.env', 'private-settings.php', 'feedback-config.php'}
          assert len(names) == len(set(names)) and required <= set(names)
          user = os.getenv('FTP_USER', '')
          password = os.getenv('FTP_PASSWORD', '')
          if not user or not password or any(ch in user+password for ch in '\r\n\x00'):
              sys.exit('BLOCK: missing or malformed FTPS repository secrets')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          try:
              ftp.connect('ftpupload.net', 21, timeout=30)
              ftp.login(user, password)
              ftp.prot_p()
              ftp.set_pasv(True)
              ftp.cwd('avenqir.bg5.net/htdocs')
              dest = pathlib.Path('site')
              dest.mkdir(exist_ok=True)
              missing = []
              count = 0
              total = 0
              for name in names:
                  if '/' in name or '\\' in name or name.startswith('.') or name.lower() in bad_names:
                      sys.exit('BLOCK: unsafe source filename')
                  buf = io.BytesIO()
                  try:
                      ftp.retrbinary('RETR ' + name, buf.write, blocksize=65536)
                  except ftplib.error_perm as e:
                      if str(e).startswith('550'):
                          missing.append(name)
                          continue
                      raise
                  data = buf.getvalue()
                  if len(data) > 3000000 or not data:
                      sys.exit('BLOCK: empty or oversized public source '+name)
                  if name != 'hero-lake.webp':
                      patterns = [
                        rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
                        rb'github_pat_[A-Za-z0-9_]{25,}',
                        rb'gh[pousr]_[A-Za-z0-9]{30,}',
                        rb'(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{30,}',
                        rb'pfsa_[0-9]{7,}',
                        rb'sql[0-9]{2,}\.web\.pfsdns\.org',
                      ]
                      if any(re.search(p, data) for p in patterns):
                          sys.exit('BLOCK: potential credential in '+name+'; no source committed')
                      if name.endswith(('.php','.html','.js','.json','.css','.svg','.webmanifest')):
                          try: data.decode('utf-8')
                          except UnicodeDecodeError: sys.exit('BLOCK: unexpected binary file '+name)
                  (dest / name).write_bytes(data)
                  total += len(data)
                  count += 1
              if required.intersection(missing):
                  sys.exit('BLOCK: essential website files missing: '+', '.join(sorted(required.intersection(missing))))
              if count < 20 or total > 12000000:
                  sys.exit('BLOCK: incomplete or unexpectedly large website snapshot')
              print('PASS: '+str(count)+' approved public files imported from authenticated FTPS; '
                    +str(len(missing))+' optional files absent; '+str(total)+' bytes. '
                    +'No hidden folders or secrets downloaded.')
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
      - name: Validate local public-site structure
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/directory.html
          test -f site/fun.html
          test -f site/tools.html
          python3 - <<'PY'
          from pathlib import Path
          source=Path('site')
          names=[x.name for x in source.iterdir()]
          assert all(x.is_file() and not x.is_symlink() for x in source.iterdir())
          assert not any(n.startswith('.') or n in ('_store','_private') for n in names)
          PY
      - name: Commit import without publishing website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site
          if git diff --cached --quiet; then
            echo 'NO_CHANGE: public source already matches site/'
            exit 0
          fi
          git commit -m 'Import publicly deployable AVENQIR source from installed SEUS site'
          git push origin HEAD:main

<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>网站更新状态 · AVENQIR</title><link rel="stylesheet" href="common.css"><style>main{max-width:720px;margin:10vh auto;padding:22px}.update-panel{padding:24px;border:1px solid #ffffff30;border-radius:20px;background:#112333;color:#eaf3fc}code{overflow-wrap:anywhere}a{color:#8ec5ff}</style></head><body><main><div class="update-panel"><p>AVENQIR / SYSTEM</p><h1>网站部署状态</h1><p id="state">正在读取…</p><p><a href="index.html">返回首页</a> · <a href="health.html">网站健康检查</a></p><p style="font-size:13px;opacity:.75">此接口仅显示公开的提交编号与部署时间，不提供登录或远程上传能力。</p></div></main><script>fetch('deploy-state.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('尚未部署');return r.json()}).then(d=>{if(!/^[0-9a-f]{40}$/.test(d.commit||''))throw Error('数据格式不正确');document.getElementById('state').textContent='已部署 · '+(d.deployed_at||'未知时间')+' · 提交 '+d.commit.slice(0,12)}).catch(e=>{document.getElementById('state').textContent='暂无自动部署记录：'+e.message})</script></body></html>

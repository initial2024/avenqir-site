<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>工具推荐与评价 · AVENQIR</title>
<link rel="stylesheet" href="common.css?v=96">
<link rel="stylesheet" href="theme.css?v=25">
<link rel="stylesheet" href="start-page.css?v=136">
<link rel="stylesheet" href="recommendations.css?v=139">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="atlas-source-ui.css?v=139"></head>
<body class="recommendations-page">
<header class="headbar">
  <div class="wrap head-inner">
    <a class="logo" href="index.html"><span class="logoicon">⬡</span> AVENQIR</a>
    <nav class="rec-nav" aria-label="网站导航">
      <a href="index.html" data-rec-label="home">起始页</a>
      <a href="directory.html" data-rec-label="directory">公开网址</a>
      <a class="aq-theme-link" href="appearance.html" data-aq-theme-link="1" data-rec-label="theme">主题</a>
    </nav>
  </div>
</header>
<main class="wrap rec-main" data-rec-view="full">
  <h1 data-rec-label="page">工具推荐与评价</h1>
  <div class="rec-participation">
    <span id="recSharingMode">评分默认保存在本机。</span>
    <button class="start-control" id="recManageSharing" type="button" data-rec-label="manageSharing">参与设置</button>
  </div>
  <details class="rec-panel" id="recTrending">
    <summary data-rec-title>近期热门 · 本机</summary>
    <div class="rec-head">
      <label><span data-rec-label="period">时间</span>
        <select id="recWindow">
          <option value="7" data-rec-label="week">近 7 天</option>
          <option value="30" data-rec-label="month">近 30 天</option>
          <option value="90" data-rec-label="allTime">近 90 天</option>
        </select>
      </label>
    </div>
    <p data-rec-mode>显示当前浏览器的记录。</p>
    <ol class="rec-trend" data-rec-trend></ol>
  </details>
  <details class="rec-panel rec-preferences" id="recPreferences">
    <summary data-rec-label="privacySettings">参与设置</summary>
    <label><input type="checkbox" id="recLocal"><span data-rec-label="local">记录本机热度</span></label>
    <label><input type="checkbox" id="recShare"><span data-rec-label="share">参与公开榜单与评分</span></label>
    <p data-rec-label="sharingCopy">开启后，打开本页收录的入口或评价时，会向 AVENQIR 发送公开条目 ID、星级（如有）和本浏览器的随机代号。公开区只展示汇总。你的书签、搜索词和笔记留在本机。</p>
    <div class="rec-head">
      <button type="button" class="start-control" data-rec-clear="local" data-rec-label="clearLocal">清除本机点击和评分</button>
      <button type="button" class="start-control" id="recRevoke" data-rec-clear="public" data-rec-label="withdraw">撤回公开评分并关闭参与</button>
      <a href="privacy.html#recommendations" data-rec-label="privacy">隐私说明</a>
    </div>
  </details>
  <p data-rec-status class="rec-status" role="status" aria-live="polite"></p>
  <div class="rec-head rec-sort">
    <h2 id="recListHeading" data-rec-label="list">工具与网址评分</h2>
    <button type="button" class="start-control" id="recClearFilter" data-rec-label="clearFilter" hidden>浏览全部</button>
  </div>
  <p class="aq-source-notice" data-atlas-source-notice>外链由第三方运营。来源核对针对精确网址，不能保证第三方内容、隐私处理或访问安全。</p>
  <div class="rec-filters">
    <label><span data-rec-label="scope">数据范围</span><select id="recScope"><option value="public" data-rec-label="publicScope">公开汇总</option><option value="local" data-rec-label="localScope">我的本机</option></select></label>
    <label class="rec-find"><span data-rec-label="find">按名称、域名或分类搜索</span>
      <input id="recQuery" type="search" maxlength="140" autocomplete="off">
    </label>
    <label><span data-rec-label="type">类型</span>
      <select id="recType">
        <option value="all" data-rec-label="all">全部类型</option>
        <option value="tool" data-rec-label="tool">本站工具</option>
        <option value="website" data-rec-label="website">第三方网址</option>
      </select>
    </label>
    <label><span data-rec-label="source">来源</span><select id="recSource"><option value="all" data-rec-label="allSources">全部来源</option><option value="reviewed" data-rec-label="reviewed">来源已核对</option><option value="pending" data-rec-label="pending">来源待核对</option></select></label>
    <label><span data-rec-label="sort">排序</span>
      <select id="recSort">
        <option value="recommended" data-rec-label="recommended">推荐指数</option>
        <option value="rating" data-rec-label="rating">评分最高</option>
        <option value="popular" data-rec-label="popular">近期热门</option>
        <option value="editor" data-rec-label="editor">编辑精选</option>
        <option value="mine" data-rec-label="mine">我评过的</option>
        <option value="name" data-rec-label="name">名称 A–Z</option>
      </select>
    </label>
  </div>
  <p id="recBasis" class="rec-count" role="status"></p>
  <p id="recCount" class="rec-count" role="status" aria-live="polite"></p>
  <div id="recCards" class="rec-grid"></div>
  <nav class="rec-pagination" aria-label="分页" hidden>
    <button type="button" id="recPrevious" class="start-control" data-rec-label="previous">上一页</button>
    <button type="button" id="recNext" class="start-control" data-rec-label="next">下一页</button>
  </nav>
</main>
<dialog class="rec-confirm" id="recClearDialog" aria-labelledby="recClearTitle" aria-describedby="recClearChoice">
  <h2 id="recClearTitle" data-rec-label="confirm">确认操作</h2>
  <p id="recClearChoice"></p>
  <form method="dialog" class="rec-head">
    <button class="start-control" value="cancel" autofocus data-rec-label="cancel">取消</button>
    <button class="start-control" value="clear" data-rec-label="apply">确认</button>
  </form>
</dialog>
<script src="site.js?v=132" defer></script>
<script src="theme.js?v=15" defer></script>
<script src="link-gate.js?v=129" defer></script>
<script src="atlas-threat-snapshot.js?v=112" defer></script>
<script src="atlas-safety.js?v=115" defer></script>
<script src="atlas-source-ui.js?v=139" defer></script>
<script src="atlas-popular-picks.js?v=126" defer></script>
<script src="recommendations-model.js?v=139" defer></script>
<script src="recommendations.js?v=139" defer></script>
</body>
</html>
